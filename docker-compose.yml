services:
  mysql:
    image: mysql:8.0
    container_name: dvr_mysql

    environment:
      MYSQL_ROOT_PASSWORD: Dasav@7173
      MYSQL_DATABASE: dvr_project
      MYSQL_USER: dvr_user
      MYSQL_PASSWORD: dvr_password

    ports:
      - "3311:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup-database.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dvr_app

    ports:
      - "9090:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dvr_project
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Dasav@7173
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

volumes:
  mysql_data:
