<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Details</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .detail-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .detail-row {
        margin-bottom: 15px;
        display: flex;
      }
      .detail-label {
        font-weight: bold;
        width: 150px;
      }
      .detail-value {
        flex: 1;
      }
      .btn-group {
        margin-top: 20px;
      }
      a {
        margin-right: 10px;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="detail-container">
      <h2>Vehicle Details</h2>

      <div class="detail-row" th:if="${vehicle}">
        <span class="detail-label">ID:</span>
        <span class="detail-value" th:text="${vehicle.id}">-</span>
      </div>
      <div class="detail-row" th:if="${vehicle}">
        <span class="detail-label">Number:</span>
        <span class="detail-value" th:text="${vehicle.number}">-</span>
      </div>
      <div class="detail-row" th:if="${vehicle}">
        <span class="detail-label">Model:</span>
        <span class="detail-value" th:text="${vehicle.model}">-</span>
      </div>
      <div class="detail-row" th:if="${vehicle}">
        <span class="detail-label">Current Location:</span>
        <span class="detail-value" th:text="${vehicle.currentLocation}">-</span>
      </div>
      <div class="detail-row" th:if="${vehicle}">
        <span class="detail-label">Destination:</span>
        <span class="detail-value" th:text="${vehicle.destination}">-</span>
      </div>
      <div class="detail-row" th:if="${vehicle}">
        <span class="detail-label">Status:</span>
        <span class="detail-value" th:text="${vehicle.status}">-</span>
      </div>
      <div class="detail-row" th:if="${vehicle}">
        <span class="detail-label">Driver:</span>
        <span
          class="detail-value"
          th:text="${vehicle.driver?.name} ?: 'Not Assigned'"
          >-</span
        >
      </div>

      <div class="btn-group" th:if="${vehicle}">
        <a th:href="'/vehicles/' + ${vehicle.id} + '/edit'"
          ><button>Edit</button></a
        >
        <a href="/vehicles"><button>Back to List</button></a>
      </div>

      <div th:if="!${vehicle}">
        <p>Vehicle not found</p>
        <a href="/vehicles"><button>Back to List</button></a>
      </div>
    </div>
  </body>
</html>
